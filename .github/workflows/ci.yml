name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make workspace writable for non-root Docker user
        run: sudo chmod -R a+rwX "$GITHUB_WORKSPACE"

      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: "9.0"
          ocaml_version: "4.14-flambda"
          custom_script: |
            startGroup "Print versions"
              rocq --version
              ocamlc -version
            endGroup
            startGroup "Build"
              make -j 2
            endGroup
            startGroup "Kernel re-validation"
              coqchk -silent -Q . Tiling Tiling.Tiling
            endGroup
